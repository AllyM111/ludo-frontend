/* The game canvas is sized by the script below to fit any screen, centered. */
#canvas {
	display: block;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}

#canvas:focus {
	outline: none;
}

/* Scale unit: 1u = 1% of the loading picture's width (picture is 3:2, fitted inside the window). */
:root {
	--u: min(1vw, 1.5vh);
}

@supports (height: 100dvh) {
	:root {
		--u: min(1vw, 1.5dvh);
	}
}

#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #00173d;
	background-image: linear-gradient(to bottom, #001e50, #00112f);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
}

/* Fills any empty space around the picture with a dark, blurred copy of it. */
#status::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background: url("$GODOT_SPLASH?v=3") center / cover no-repeat;
	filter: blur(40px) brightness(0.38) saturate(0.95);
	transform: scale(1.2);
}

#status-stage {
	position: absolute;
	top: 50%;
	left: 50%;
	width: calc(var(--u) * 100);
	aspect-ratio: 3 / 2;
	transform: translate(-50%, -50%);
}

#status-splash {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	object-fit: fill;
	user-select: none;
	-webkit-user-drag: none;
	/* Soft edges (only on the sides that touch the blurred background). */
	-webkit-mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
	mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
}

@media (min-aspect-ratio: 3/2) {
	#status-splash {
		-webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
		mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
	}
}

#status-loader {
	position: absolute;
	left: 50%;
	bottom: 6.7%;
	transform: translateX(-50%);
	width: max(24.7%, 170px);
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: calc(var(--u) * 0.7);
}

#status-progress, #status-label, #status-notice {
	display: none;
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	box-sizing: border-box;
	width: 100%;
	height: max(calc(var(--u) * 1.75), 9px);
	margin: 0;
	padding: 0;
	overflow: hidden;
	border: 1px solid rgba(190, 215, 255, 0.5);
	border-radius: 999px;
	background: rgba(2, 10, 32, 0.85);
	box-shadow: 0 0 14px rgba(30, 140, 255, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.6);
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
	transition: width 0.25s ease;
}

#status-progress::-moz-progress-bar {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
}

#status-label {
	text-align: center;
	color: #ffffff;
	font-family: 'Segoe UI', 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 700;
	font-size: max(calc(var(--u) * 1.25), 11px);
	letter-spacing: 0.04em;
	line-height: 1.2;
	text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#menu-overlay {
	position: fixed;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	z-index: 5;
	display: none;
	overflow: hidden;
	background-color: #00112f;
	--img: var(--menu-img);
}

#menu-overlay[data-screen="mode"] {
	--img: var(--mode-img);
}

#menu-overlay.show {
	display: block;
}

#menu-overlay::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background: var(--img) center / cover no-repeat;
	filter: blur(26px) brightness(0.6);
	transform: scale(1.15);
}

#menu-stage {
	position: absolute;
	overflow: hidden;
}

#menu-art {
	position: absolute;
	background: var(--img) 0 0 / 100% 100% no-repeat;
	user-select: none;
	-webkit-user-select: none;
}

.menu-hit {
	position: absolute;
	display: none;
	cursor: pointer;
	border-radius: 999px;
	background: transparent;
	-webkit-tap-highlight-color: transparent;
	transition: box-shadow 0.15s ease, background-color 0.15s ease, transform 0.08s ease;
}

#menu-overlay[data-screen="menu"] .menu-hit[data-screen="menu"],
#menu-overlay[data-screen="mode"] .menu-hit[data-screen="mode"] {
	display: block;
}

.menu-hit:hover {
	background-color: rgba(255, 255, 255, 0.07);
	box-shadow: 0 0 0 2px rgba(255, 224, 130, 0.9), 0 0 18px rgba(255, 200, 60, 0.55);
}

.menu-hit:active {
	background-color: rgba(255, 255, 255, 0.16);
	transform: scale(0.985);
}

#menu-version {
	position: absolute;
	right: 8px;
	bottom: 6px;
	font: 11px 'Segoe UI', Arial, sans-serif;
	color: rgba(255, 255, 255, 0.55);
	pointer-events: none;
}

// The picture behind it fills the rest, so there are no black bars.
(function () {
	const BASE_W = 1100;
	const BASE_H = 900;
	const canvas = document.getElementById('canvas');

	function fitCanvas() {
		const vv = window.visualViewport;
		const vw = Math.max(1, vv ? vv.width : window.innerWidth);
		const vh = Math.max(1, vv ? vv.height : window.innerHeight);
		const dpr = window.devicePixelRatio || 1;
		const scale = Math.min(vw / BASE_W, vh / BASE_H);
		const cssW = Math.max(1, Math.floor(BASE_W * scale));
		const cssH = Math.max(1, Math.floor(BASE_H * scale));
		const pxW = Math.max(1, Math.round(cssW * dpr));
		const pxH = Math.max(1, Math.round(cssH * dpr));
		if (canvas.width !== pxW || canvas.height !== pxH) {
			canvas.width = pxW;
			canvas.height = pxH;
		}
		canvas.style.width = cssW + 'px';
		canvas.style.height = cssH + 'px';
	}

	fitCanvas();
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 150); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}

		const vv = window.visualViewport;
		const vw = Math.max(1, vv ? vv.width : window.innerWidth);
		const vh = Math.max(1, vv ? vv.height : window.innerHeight);

		const crop = (vw / vh < 1.25) ? { x: 575, y: 0, w: 690, h: IMG_H } : { x: 0, y: 0, w: IMG_W, h: IMG_H };

		const sh = crop.h * s;
		stage.style.left = ((vw - sw) / 2) + 'px';

			for (let y = 0; y < 225; y++) {

			return;

	function setStatusMode(mode) {

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);

			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});

			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusLabel.textContent = 'Loading... ' + Math.min(100, Math.floor((current / total) * 100)) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusLabel.textContent = 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			if (window.__afriMenuStart) {
