<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Afri Ludo — Rwanda Edition</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Scale unit: 1u = 1% of the loading picture's width (picture is 3:2, fitted inside the window). */
:root {
	--u: min(1vw, 1.5vh);
}

@supports (height: 100dvh) {
	:root {
		--u: min(1vw, 1.5dvh);
	}
}

#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #00173d;
	background-image: linear-gradient(to bottom, #001e50, #00112f);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
}

/* Fills any empty space around the picture with a dark, blurred copy of it. */
#status::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background: url("index.png?v=3") center / cover no-repeat;
	filter: blur(40px) brightness(0.38) saturate(0.95);
	transform: scale(1.2);
}

#status-stage {
	position: absolute;
	top: 50%;
	left: 50%;
	width: calc(var(--u) * 100);
	aspect-ratio: 3 / 2;
	transform: translate(-50%, -50%);
}

#status-splash {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	object-fit: fill;
	user-select: none;
	-webkit-user-drag: none;
	/* Soft edges (only on the sides that touch the blurred background). */
	-webkit-mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
	mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
}

@media (min-aspect-ratio: 3/2) {
	#status-splash {
		-webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
		mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
	}
}

#status-loader {
	position: absolute;
	left: 50%;
	bottom: 6.7%;
	transform: translateX(-50%);
	width: max(24.7%, 170px);
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: calc(var(--u) * 0.7);
}

#status-progress, #status-label, #status-notice {
	display: none;
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	box-sizing: border-box;
	width: 100%;
	height: max(calc(var(--u) * 1.75), 9px);
	margin: 0;
	padding: 0;
	overflow: hidden;
	border: 1px solid rgba(190, 215, 255, 0.5);
	border-radius: 999px;
	background: rgba(2, 10, 32, 0.85);
	box-shadow: 0 0 14px rgba(30, 140, 255, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.6);
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
	transition: width 0.25s ease;
}

#status-progress::-moz-progress-bar {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
}

#status-label {
	text-align: center;
	color: #ffffff;
	font-family: 'Segoe UI', 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 700;
	font-size: max(calc(var(--u) * 1.25), 11px);
	letter-spacing: 0.04em;
	line-height: 1.2;
	text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-stage">
				<img id="status-splash" src="index.png?v=3" alt="">
				<div id="status-loader">
					<progress id="status-progress"></progress>
					<div id="status-label">Loading...</div>
				</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2274564,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLabel = document.getElementById('status-label');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusLabel.textContent = 'Loading... ' + Math.min(100, Math.floor((current / total) * 100)) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusLabel.textContent = 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
