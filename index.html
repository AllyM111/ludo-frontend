/* The game canvas is sized by the script below to fit any screen, centered. */
#canvas {
	display: block;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}

#canvas:focus {
	outline: none;
}

/* Scale unit: 1u = 1% of the loading picture's width (picture is 3:2, fitted inside the window). */
:root {
	--u: min(1vw, 1.5vh);
}

@supports (height: 100dvh) {
	:root {
		--u: min(1vw, 1.5dvh);
	}
}

#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #00173d;
	background-image: linear-gradient(to bottom, #001e50, #00112f);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
}

/* Fills any empty space around the picture with a dark, blurred copy of it. */
#status::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background: url("index.png?v=3") center / cover no-repeat;
	filter: blur(40px) brightness(0.38) saturate(0.95);
	transform: scale(1.2);
}

#status-stage {
	position: absolute;
	top: 50%;
	left: 50%;
	width: calc(var(--u) * 100);
	aspect-ratio: 3 / 2;
	transform: translate(-50%, -50%);
}

#status-splash {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	object-fit: fill;
	user-select: none;
	-webkit-user-drag: none;
	/* Soft edges (only on the sides that touch the blurred background). */
	-webkit-mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
	mask-image: linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
}

@media (min-aspect-ratio: 3/2) {
	#status-splash {
		-webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
		mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
	}
}

#status-loader {
	position: absolute;
	left: 50%;
	bottom: 6.7%;
	transform: translateX(-50%);
	width: max(24.7%, 170px);
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: calc(var(--u) * 0.7);
}

#status-progress, #status-label, #status-notice {
	display: none;
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	box-sizing: border-box;
	width: 100%;
	height: max(calc(var(--u) * 1.75), 9px);
	margin: 0;
	padding: 0;
	overflow: hidden;
	border: 1px solid rgba(190, 215, 255, 0.5);
	border-radius: 999px;
	background: rgba(2, 10, 32, 0.85);
	box-shadow: 0 0 14px rgba(30, 140, 255, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.6);
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
	transition: width 0.25s ease;
}

#status-progress::-moz-progress-bar {
	border-radius: 999px;
	background: linear-gradient(180deg, #86d4ff 0%, #22a6ff 45%, #0a6ee0 100%);
	box-shadow: 0 0 10px rgba(60, 170, 255, 0.9);
}

#status-label {
	text-align: center;
	color: #ffffff;
	font-family: 'Segoe UI', 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 700;
	font-size: max(calc(var(--u) * 1.25), 11px);
	letter-spacing: 0.04em;
	line-height: 1.2;
	text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#menu-overlay {

	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	z-index: 5;
	display: none;
	overflow: hidden;
	background-color: #00112f;
}

#menu-overlay.show {
	display: block;
}

#menu-overlay::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background: var(--menu-img) center / cover no-repeat;
	filter: blur(26px) brightness(0.6);
	transform: scale(1.15);
}

#menu-stage {
	position: absolute;
	overflow: hidden;
}

#menu-art {
	position: absolute;
	background: var(--menu-img) 0 0 / 100% 100% no-repeat;
	user-select: none;
	-webkit-user-select: none;
}

.menu-hit {
	position: absolute;
	cursor: pointer;
	border-radius: 999px;
	background: transparent;
	-webkit-tap-highlight-color: transparent;
	transition: box-shadow 0.15s ease, background-color 0.15s ease, transform 0.08s ease;
}

.menu-hit:hover {
	background-color: rgba(255, 255, 255, 0.07);
	box-shadow: 0 0 0 2px rgba(255, 224, 130, 0.9), 0 0 18px rgba(255, 200, 60, 0.55);
}

.menu-hit:active {
	background-color: rgba(255, 255, 255, 0.16);
	transform: scale(0.985);
}

	right: 8px;
	bottom: 6px;
	font: 11px 'Segoe UI', Arial, sans-serif;
	color: rgba(255, 255, 255, 0.55);
	pointer-events: none;
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","mainPack":"index.pck?v=5","experimentalVK":false,"fileSizes":{"index.pck?v=5":2706912,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

// Fit the game (designed at 1100 x 900) inside any window: phones, tablets, laptops, TVs.
// The picture behind it fills the rest, so there are no black bars.
(function () {
	const BASE_W = 1100;
	const BASE_H = 900;
	const canvas = document.getElementById('canvas');

	function fitCanvas() {
		const vv = window.visualViewport;
		const vw = Math.max(1, vv ? vv.width : window.innerWidth);
		const vh = Math.max(1, vv ? vv.height : window.innerHeight);
		const dpr = window.devicePixelRatio || 1;
		const scale = Math.min(vw / BASE_W, vh / BASE_H);
		const cssW = Math.max(1, Math.floor(BASE_W * scale));
		const cssH = Math.max(1, Math.floor(BASE_H * scale));
		const pxW = Math.max(1, Math.round(cssW * dpr));
		const pxH = Math.max(1, Math.round(cssH * dpr));
		if (canvas.width !== pxW || canvas.height !== pxH) {
			canvas.width = pxW;
			canvas.height = pxH;
		}
		canvas.style.width = cssW + 'px';
		canvas.style.height = cssH + 'px';
	}

	fitCanvas();
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 150); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
}());


// New main menu: the picture is shown on top of the game's own main menu, and a tap on
// one of its buttons is passed on to the matching (hidden) game button underneath.
(function () {
	const IMG_W = 1812;
	const IMG_H = 868;
	const BASE_W = 1100;
	const BASE_H = 900;
	// picture button rectangle (x, y, w, h in picture pixels) and where the game's own button is (game pixels)
	const BUTTONS = [
		{ key: 'play', label: 'Play', x: 710, y: 442, w: 376, h: 66, gx: 550, gy: 309 },
		{ key: 'online', label: 'Online multiplayer', x: 710, y: 519, w: 376, h: 44, gx: 550, gy: 372 },
		{ key: 'leaderboard', label: 'Leaderboard', x: 710, y: 570, w: 376, h: 44, gx: 550, gy: 426 },
		{ key: 'profile', label: 'Profile', x: 710, y: 621, w: 376, h: 45, gx: 550, gy: 480 },
		{ key: 'settings', label: 'Settings', x: 710, y: 672, w: 376, h: 45, gx: 550, gy: 534 },
	];
	const overlay = document.getElementById('menu-overlay');
	const stage = document.getElementById('menu-stage');
	const art = document.getElementById('menu-art');
	const canvas = document.getElementById('canvas');
	const hits = [];
	let started = false;
	let startedAt = 0;
	let shown = false;
	let okCount = 0;
	let badCount = 0;

	BUTTONS.forEach(function (b) {
		const el = document.createElement('div');
		el.className = 'menu-hit';
		el.setAttribute('role', 'button');
		el.setAttribute('aria-label', b.label);
		el.addEventListener('click', function (ev) {
			ev.preventDefault();
			forwardClick(b.gx, b.gy);
		});
		stage.appendChild(el);
		hits.push(el);
	});

	function layout() {
		const vv = window.visualViewport;
		const vw = Math.max(1, vv ? vv.width : window.innerWidth);
		const vh = Math.max(1, vv ? vv.height : window.innerHeight);
		// Tall (phone) screens show just the card part of the picture, so it stays big enough to read.
		const crop = (vw / vh < 1.25) ? { x: 575, y: 0, w: 690, h: IMG_H } : { x: 0, y: 0, w: IMG_W, h: IMG_H };
		const s = Math.min(vw / crop.w, vh / crop.h);
		const sw = crop.w * s;
		const sh = crop.h * s;
		stage.style.left = ((vw - sw) / 2) + 'px';
		stage.style.top = ((vh - sh) / 2) + 'px';
		stage.style.width = sw + 'px';
		stage.style.height = sh + 'px';
		art.style.width = (IMG_W * s) + 'px';
		art.style.height = (IMG_H * s) + 'px';
		art.style.left = (-crop.x * s) + 'px';
		art.style.top = (-crop.y * s) + 'px';
		BUTTONS.forEach(function (b, i) {
			const el = hits[i];
			el.style.left = ((b.x - crop.x) * s) + 'px';
			el.style.top = ((b.y - crop.y) * s) + 'px';
			el.style.width = (b.w * s) + 'px';
			el.style.height = (b.h * s) + 'px';
		});
	}

	function forwardClick(gx, gy) {
		const r = canvas.getBoundingClientRect();
		const cx = r.left + (gx / BASE_W) * r.width;
		const cy = r.top + (gy / BASE_H) * r.height;
		const base = { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, screenX: cx, screenY: cy, button: 0 };
		try { canvas.focus(); } catch (e) { /* ignore */ }
		canvas.dispatchEvent(new MouseEvent('mousemove', Object.assign({ buttons: 0 }, base)));
		canvas.dispatchEvent(new MouseEvent('mousedown', Object.assign({ buttons: 1 }, base)));
		setTimeout(function () {
			canvas.dispatchEvent(new MouseEvent('mouseup', Object.assign({ buttons: 0 }, base)));
		}, 70);
	}

	// Is the game showing its own main menu right now? (its yellow PLAY button is on screen)
	const probe = document.createElement('canvas');
	probe.width = 1;
	probe.height = 1;
	const pctx = probe.getContext('2d', { willReadFrequently: true });

	function isYellow(gx, gy) {
		try {
			const sx = Math.min(canvas.width - 1, Math.max(0, Math.round((gx / BASE_W) * canvas.width)));
			const sy = Math.min(canvas.height - 1, Math.max(0, Math.round((gy / BASE_H) * canvas.height)));
			pctx.clearRect(0, 0, 1, 1);
			pctx.drawImage(canvas, sx, sy, 1, 1, 0, 0, 1, 1);
			const d = pctx.getImageData(0, 0, 1, 1).data;
			return d[3] > 200 && d[0] > 200 && d[1] > 140 && d[2] < 100;
		} catch (e) {
			return null; // cannot read the canvas on this device
		}
	}

	function setShown(v) {
		if (v === shown) {
			return;
		}
		shown = v;
		overlay.classList.toggle('show', v);
	}

	function tick() {
		if (!started) {
			return;
		}
		const a = isYellow(425, 298);
		const b = isYellow(674, 298);
		if (a === null || b === null) {
			// Cannot tell what the game is showing: fall back to the game's own menu.
			setShown(false);
			return;
		}
		if (a && b) {
			okCount++;
			badCount = 0;
			if (okCount >= 2) {
				setShown(true);
			}
		} else {
			badCount++;
			okCount = 0;
			// the game needs a moment to draw its first frame, so ignore "not menu" for the first 1.5 s
			if (badCount >= 2 && Date.now() - startedAt > 1500) {
				setShown(false);
			}
		}
	}

	window.__afriMenuStart = function () {
		started = true;
		startedAt = Date.now();
		layout();
		setShown(true);
		setInterval(tick, 250);
	};

	window.addEventListener('resize', layout);
	window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', layout);
	}
	layout();
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLabel = document.getElementById('status-label');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusLabel.textContent = 'Loading... ' + Math.min(100, Math.floor((current / total) * 100)) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusLabel.textContent = 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			if (window.__afriMenuStart) {
				window.__afriMenuStart();
			}
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
